gin-bottom:12px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.metric-groups{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:0;background:var(--paper);border:1px solid var(--line);border-radius:12px;margin:22px 0;overflow:hidden}.metric-group{padding:24px;border-right:1px solid var(--line)}.metric-group:last-child{border-right:0}.metric{display:flex;justify-content:space-between;gap:14px;align-items:baseline;margin:18px 0}.metric strong{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}.metric span{font-size:13px}.notice{padding:14px 18px;border-radius:7px;background:var(--soft);color:#1b574b;margin:14px 0;overflow-wrap:anywhere}.notice.error{background:var(--danger-bg);color:var(--danger)}.notice.warn{background:var(--warn-bg);color:var(--warn)}.notice .actions{margin-top:10px}.pairs{display:grid;grid-template-columns:160px 1fr;gap:10px 18px;margin:0}.pairs dt{color:var(--muted)}.pairs dd{margin:0;overflow-wrap:anywhere}.comparison{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start}.comparison .section{margin-top:0;min-width:0}.comparison .current{background:#f8faf7}.field{display:flex;flex-direction:column;gap:6px;margin:16px 0}.field label{font-size:13px;font-weight:500}.field .help{font-size:12px;color:var(--muted)}.field input,.field textarea,.field select{width:100%}.two-fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}.empty{padding:46px 22px;text-align:center;background:var(--paper);border:1px solid var(--line);border-radius:10px}.empty p{margin:8px auto 16px}.breadcrumbs{margin:0 0 20px;font-size:13px}.prototype{margin:0;background:var(--prototype);color:var(--prototype-ink);border-bottom:1px solid #d8cfe7;padding:10px 36px}.prototype summary{cursor:pointer;font-size:12px}.prototype .controls{display:flex;gap:12px;flex-wrap:wrap;align-items:end;margin:14px 0 4px}.prototype label{font-size:12px;display:flex;flex-direction:column;gap:4px}.prototype small{color:var(--pr <body>
<div class="shell" id="shell">
<aside><div class="brand">家务搭档<small>平台后台</small></div><nav id="nav" aria-label="主导航"></nav><p class="aside-note">家庭协作，由双方决定。<br>平台维护必要的运行与内容。</p></aside>
<div class="right"><header><div class="actions"><button class="mobile-menu" id="mobile-menu" aria-expanded="false">导航</button><span>运营工作台</span></div><div id="account" class="account"></div></header>
<details class="prototype" id="demo"><summary>讨论用粗原型 · 所有数据均为模拟 · 展开试走与异常演示</summary><div class="controls">
<label>演示身份<select id="demo-role"><option value="A1">林晓 · 超级管理员</option><option value="A2">周宁 · 运营管理员</option></select></label>
<label>页面状态<select id="demo-page"><option value="normal">正常数据</option><option value="empty">无数据</option><option value="loadfail">读取失败</option><option value="loading">加载中</option></select></label>
<label>下一次提交时模拟<select id="demo-scenario"><option value="normal">正常成功</option><option value="fail">明确失败，未生效</option><option value="revoke">当前账号被停用</option><option value="archive">家庭已被成员退出归档（恢复时）</option></select></label>
<button id="forbidden">直接访问家庭详情</button><button id="reset">重置全部演示</button></div><small>演示身份与故障开关不属于正式后台。刷新会重置操作；没有真实权限变更或数据写入。</small><div id="state" class="state-summary"></div></details>
<main class="page" id="main"></main></div></div>
<dialog id="dialog" aria-labelledby="dialog-title"><h2 id="dialog-title"></h2><div id="dialog-body"></div><div id="dialog-error" class="notice error" role="alert"></div><div class="actions"><button id="cancel-dialog">返回修改</button><button id="confirm-dialog" class="primary">确认</button></div></dialog>
<script>
'use strict';
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const zones=['厨房烹饪','客厅公共区','卧室衣物','卫浴清洁','阳台宠植','综合事务'];
const cycles=['每天','每周','每 N 个月','每 N 天','一次性'];
const modules=[['overview','运行概况'],['families','家庭管理'],['chores','公共家务预设'],['perks','默认特权模板'],['admins','管理员管理'],['logs','操作记录']];
let families=[{id:'F1001',name:'梧桐小家',status:'使用中',created:'2026-08-12',recent:'2026-09-08',members:[['U2101','小禾','2026-08-12'],['U2102','阿原','2026-08-13']]},{id:'F1002',name:'向阳之家',status:'停用',created:'2026-07-23',recent:'2026-09-05',reason:'异常使用核查，暂时暂停家庭协作。',time:'2026-09-06 10:30',members:[['U2201','小满','2026-07-23'],['U2202','阿青','2026-07-24']]},{id:'F1003',name:'周末小屋',status:'归档',created:'2026-06-01',recent:'2026-08-30',members:[['U2301','安安','2026-06-01'],['U2302','小林','2026-06-02']]},{id:'F1004',name:'一米阳光',status:'使用中',created:'2026-09-07',recent:'—',members:[['U2401','晚晚','2026-09-07']]}];
let admins=[{id:'A1',name:'林晓',account:'lin.xiao',role:'超级管理员',active:true},{id:'A2',name:'周宁',account:'zhou.ning',role:'运营管理员',active:true},{id:'A3',name:'陈安',account:'chen.an',role:'运营管理员',active:false}];
function chore(name,desc,zone,cycle,params,points,order){return{name,desc,zone,cycle,params,points,order}}
function perk(name,desc,points,order){return{name,desc,points,order}}
let templates=[{id:'T101',kind:'chores',status:'已发布',published:chore('清洁灶台','擦净灶台、旋钮与台面油渍，收好清洁工具。',zones[0],'每天','',20,10),draft:null},{id:'T102',kind:'chores',status:'已发布',published:chore('更换床品','拆洗床单、被套与枕套，铺好干净床品。',zones[2],'每周','周六',40,20),draft:chore('更换床品','拆洗床单、被套与枕套，铺好干净床品并收纳替换件。',zones[2],'每周','周六',50,20)},{id:'T103',kind:'chores',status:'已下架',published:chore('清洁卫浴镜面','擦净镜面水渍，清理边框并保持干燥。',zones[3],'每周','周日',20,30),draft:null},{id:'T104',kind:'chores',status:'草稿',published:null,draft:chore('整理阳台盆栽','',zones[4],'每 N 天','',30,40)},{id:'T105',kind:'perks',status:'已发布',published:perk('肩颈按摩 20 分钟','在双方约定的时间，提供 20 分钟肩颈放松按摩。',100,10),draft:null},{id:'T106',kind:'perks',status:'已下架',published:perk('周末早餐','准备一份双方约定的周末早餐并收拾餐具。',80,20),draft:perk('周末早餐','准备双方约定的早餐、饮品并收拾餐具。',120,20)},{id:'T107',kind:'perks',status:'草稿',published:null,draft:perk('电影之夜','',0,30)}];
let logs=[{actor:'A1',name:'林晓',time:'2026-09-06 10:30',object:'F1002',action:'停用家庭',result:'成功',reason:'异常使用核查，暂时暂停家庭协作。'},{actor:'A2',name:'周宁',time:'2026-09-05 16:20',object:'T102',action:'保存编辑',result:'成功',reason:''},{actor:'A1',name:'林晓',time:'2026-09-04 09:10',object:'T106',action:'下架模板',result:'成功',reason:''}];
let current='A1', route='overview', selected=null, pageState='normal', scenario='normal', notice='', noticeKind='', range='近 7 日', query='', statusFilter='全部', zoneFilter='全部', cycleFilter='全部', edit=null, dirty=false, modalAction=null, modalMeta=null, loadingTimer;
const reasonInputs={};
const user=()=>admins.find(a=>a.id===current), superUser=()=>user().active&&user().role==='超级管理员', can=r=>user().active&&(!['families','family','admins'].includes(r)||superUser());
function currentModule(){return route==='family'?'families':route==='edit'?(templates.find(t=>t.id===selected)?.kind||'chores'):route}
function badge(s){return `<span class="chip ${['停用','已下架'].includes(s)?'off':['草稿','归档'].includes(s)?'gray':''}">${esc(s)}</span>`}
function heading(title,desc,action=''){return `<div class="page-heading"><div><h1>${esc(title)}</h1><p>${desc}</p></div>${action}</div>`}
function button(label,action,klass='',extra=''){return `<button class="${klass}" data-action="${action}" ${extra}>${label}</button>`}
function msg(text,kind=''){notice=text;noticeKind=kind;render()}
function record(object,action,result='成功',reason=''){logs.unshift({actor:current,name:user().name,time:new Date().toLocaleString('sv-SE',{timeZone:'Asia/Shanghai'}).slice(0,16),object,action,result,reason})}
function navTo(next,id=null){if(dirty){openDialog('离开编辑页？','<p>本次尚未保存的输入将丢失；已经保存的编辑稿与当前发布内容不变。</p>','离开并放弃输入',()=>{dirty=false;closeDialog();go(next,id) });return}go(next,id)}
function go(next,id=null){route=next;selected=id;edit=null;dirty=false;query='';statusFilter=zoneFilter=cycleFilter='全部';notice='';$('#shell').classList.remove('menu-open');$('#mobile-menu').setAttribute('aria-expanded','false');history.replaceState(null,'','#'+next+(id?'/'+id:''));render();window.scrollTo(0,0)}
function empty(message,action=''){return `<div class="empty"><h2>${message}</h2><p class="muted">${pageState==='empty'?'当前演示为无数据状态。':'可以调整条件后再查看。'}</p>${action}</div>`}
function render(){
 $('#account').innerHTML=`${esc(user().name)} <span class="chip ${!user().active?'off':''}">${user().active?esc(user().role):'账号已停用'}</span>`;
 $('#nav').innerHTML=modules.filter(([r])=>can(r)).map(([r,n])=>`<a href="#${r}" data-route="${r}" ${currentModule()===r?'aria-current="page"':''}>${r==='logs'&&!superUser()?'本人操作记录':n}</a>`).join('');
 $('#state').textContent=`模拟状态：${user().name} / ${user().active?user().role:'账号已停用'}；页面 ${modules.find(([r])=>r===currentModule())?.[1]||route}；${scenario==='normal'?'下一次提交正常':$('#demo-scenario').selectedOptions[0].textContent}。`;
 let content='';
 if(!can(route)){content=heading(user().active?'权限不足':'当前账号已停用','当前页面不可访问，受限资料未展示。')+empty(user().active?'该页面仅超级管理员可访问':'已有会话不能继续执行操作',user().active?button('返回运行概况','overview'):button('重置演示','reset'));}
 else if(pageState==='loadfail'){content=heading('暂时无法读取页面','没有取得最新结果。')+empty('读取失败，请重试',button('重新读取','reload','primary'));}
 else if(pageState==='loading'){content=heading('正在读取页面','请稍候，当前没有可提交的操作。')+'<div class="load-skeleton" aria-label="加载中" role="status"></div>';}
 else if(route==='overview')content=overview();else if(route==='families')content=familyList();else if(route==='family')content=familyDetail();else if(['chores','perks'].includes(route))content=templateList();else if(route==='edit')content=editor();else if(route==='admins')content=adminList();else if(route==='logs')content=logPage();else content=heading('页面不存在','请从左侧导航继续。');
 $('#main').innerHTML=(notice?`<div class="notice ${noticeKind}" role="${noticeKind==='error'?'alert':'status'}">${esc(notice)}</div>`:'')+content;
}
function overview(){

function failureCheck(meta){if(scenario==='revoke'){user().active=false;scenario='normal';$('#demo-scenario').value='normal';}if(!user().active||meta?.super&&!superUser())return '当前账号权限已变化，本次操作未生效。';if(scenario==='archive'&&meta?.type==='family'&&meta.target.status==='停用'){meta.target.status='归档';scenario='normal';$('#demo-scenario').value='normal';return '该家庭已因成员退出归档，本次恢复未生效。首版不可恢复归档家庭。';}if(meta?.type==='family'&&meta.target.status!==meta.expected)return '家庭最新状态已变化，本次操作未生效，请返回查看。';if(scenario==='fail'){scenario='normal';$('#demo-scenario').value='normal';return '本次操作明确失败，未生效。输入已保留，可重试。';}return ''}
async function execute(action,meta){if(!meta){action();return}const btn=$('#confirm-dialog');btn.disabled=true;btn.textContent='正在提交…';await new Promise(r=>setTimeout(r,240));const failure=failureCheck(meta);if(failure){record(meta.object,meta.action,'失败',meta.reason||'');$('#dialog-error').textContent=failure;btn.textContent='重试提交';btn.disabled=false;if(!user().active||meta.type==='family'&&meta.target.status==='归档')btn.hidden=true;$('#cancel-dialog').textContent='返回查看';render();return}action()}
function familyChange(){const f=families.find(x=>x.id===selected),reason=$('#family-reason').value.trim();if(!reason){$('#family-reason').setCustomValidity('请填写双方可见的原因');$('#family-reason').reportValidity();return}const stopping=f.status==='使用中',target=stopping?'停用':'使用中',action=stopping?'停用家庭':'恢复家庭';const description=stopping?'暂停邀请加入、家庭设置、家务安排、认领、打卡、补记、更正、撤销、比心以及心愿与兑换处理。':'沿原日历继续，不补发停用期间的待办；原先单项暂停的家务仍暂停。旧周期待办按停用衔接规则处理，一次性未完成待办保留。';openDialog(`确认${action}？`,`<p><strong>${esc(f.name)} · ${f.id}</strong></p><p>${description}</p><p>保留原成员关系、历史、积分与待兑现。${stopping?'双方仍可查看有权访问的历史或本人退出；本人退出仍会导致整户归档。':''}</p><div class="notice warn">${stopping?'停用本身不取消待兑现、不退分。':'不恢复已归档的家庭。'}双方下次进入时看到状态结果与原因。</div><dl class="pairs"><dt>状态变化</dt><dd>${f.status} → ${target}</dd><dt>双方可见原因</dt><dd>${esc(reason)}</dd></dl>`,`确认${stopping?'停用':'恢复'}`,()=>{f.status=target;f.reason=reason;reasonInputs[f.id]='';record(f.id,action,'成功',reason);f.time=logs[0].time;closeDialog();msg(`${action}成功。${f.name}当前${f.status}，双方下次进入时可见原因。`);},{type:'family',super:true,target:f,expected:f.status,object:f.id,action,reason})}
function templateAction(a){const t=templates.find(x=>x.id===selected);collect();const meta={object:t.id,action:'',type:'template'};if(a==='save'){const failure=failureCheck(meta);if(failure){record(t.id,'保存编辑','失败');msg(failure,'error');return}t.draft=clone(edit);dirty=false;record(t.id,t.published?'保存编辑':'保存草稿');msg(t.published?'编辑稿已保存；当前发布内容未改变。':'草稿已保存，家庭暂时看不到。');return}
if(a==='publish'){const issue=validate(edit,t.kind);if(issue){msg('暂不能发布：请补齐或修正'+issue[0]+'。输入已保留。','error');($('#'+issue[1])||$('#cycle-fields input')||$('#cycle-fields select')).focus();return}const draft=clone(edit);meta.action=t.status==='已下架'?'修订后重新发布':'发布模板';openDialog('发布前预览',`<p>以下为本次确认后供家庭新选用的内容。</p>${contentView(draft,t.kind)}${t.kind==='perks'?'<p>家庭选用后仍需兑现人本人确认内容与价格，才能开放兑换。</p>':''}<div class="notice">仅影响之后选用的内容。已有家庭的家务、心愿及兑换约定不变。</div><p class="muted">保持模板来源 ${t.id}；不会让已经选过的家庭重复添加。</p>`,'确认发布',()=>{t.published=draft;t.draft=null;t.status='已发布';dirty=false;record(t.id,meta.action);closeDialog();msg('发布成功。后续选用使用此次内容，家庭已有内容不变。')},meta);return}
if(a==='unpublish'){meta.action='下架模板';openDialog('确认下架模板？',`<p>${esc(t.published.name)}</p><div class="notice warn">停止新选用；家庭已有内容不变。家庭尚未提交的选用须重新核对。</div><p>未发布的编辑稿不会被发布。之后可以重新发布最后发布内容。</p>`,'确认下架',()=>{t.status='已下架';record(t.id,meta.action);closeDialog();msg('下架成功。已停止新选用，可在左侧重新发布最后发布内容。')},meta);return}
if(a==='republish'){meta.action='重新发布最后发布内容';openDialog('重新发布最后发布内容？',contentView(t.published,t.kind)+'<div class="notice">只恢复这份最后发布内容的新选用入口；本次编辑及已保存编辑稿均不随此操作发布。家庭已有内容不变。</div>','确认重新发布',()=>{t.status='已发布';record(t.id,meta.action);closeDialog();msg('最后发布内容已重新发布。编辑稿未被发布，原模板来源保持不变。')},meta);return}
if(a==='discard'){meta.action='放弃未发布编辑';openDialog('放弃未发布编辑？','<p>将丢弃当前输入及已保存的编辑稿，保留最后发布内容。发布或下架状态不改变。</p>','确认放弃',()=>{t.draft=null;edit=null;dirty=false;record(t.id,meta.action);closeDialog();msg('已放弃编辑稿，最后发布内容保留。')},meta);return}
if(a==='delete-draft'&&!t.published){meta.action='删除草稿';openDialog('删除从未发布的草稿？','<p>该草稿尚未供家庭选用，删除不影响家庭内容。删除后不可恢复。</p>','确认删除草稿',()=>{templates=templates.filter(x=>x.id!==t.id);dirty=false;record(t.id,meta.action);closeDialog();go(t.kind);msg('草稿已删除。')},meta);}}
function adminDialog(id){const a=admins.find(x=>x.id===id);openDialog('管理管理员权限',`<p>${esc(a.name)} · ${esc(a.account)}</p><div class="field"><label for="admin-role">角色</label><select id="admin-role"><option ${a.role==='超级管理员'?'selected':''}>超级管理员</option><option ${a.role==='运营管理员'?'selected':''}>运营管理员</option></select></div><div class="field"><label for="admin-active">账号状态</label><select id="admin-active"><option value="yes" ${a.active?'selected':''}>使用中</option><option value="no" ${!a.active?'selected':''}>停用</option></select></div><div class="field"><label for="admin-reason">变更原因 · 必填</label><textarea id="admin-reason"></textarea></div><p class="muted">权限变更立即影响已有会话。不能停用或降级最后一名有效超级管理员。</p>`,'查看变更并确认',()=>{const role=$('#admin-role').value,active=$('#admin-active').value==='yes',reason=$('#admin-reason').value.trim();if(!reason){$('#dialog-error').textContent='请填写变更原因。';return}if(role===a.role&&active===a.active){$('#dialog-error').textContent='尚未修改角色或账号状态。';return}if(a.active&&a.role==='超级管理员'&&(!active||role!=='超级管理员')&&admins.filter(x=>x.active&&x.role==='超级管理员').length===1){$('#dialog-error').textContent='这是最后一名有效超级管理员，不能停用或降级。请保留至少一名有效超级管理员。';return}openDialog('确认权限变更？',`<p>${esc(a.name)} · ${esc(a.account)}</p><p>${a.role} / ${a.active?'使用中':'停用'} → ${role} / ${active?'使用中':'停用'}</p><p>原因：${esc(reason)}</p><div class="notice warn">已有会话将按最新权限执行操作。</div>`,'确认变更',()=>{record(a.id,'修改管理员权限','成功',reason);a.role=role;a.active=active;closeDialog();msg('管理员权限已变更，已有会话按最新权限执行。')},{super:true,object:a.id,action:'修改管理员权限',reason})});}
function newAdmin(){openDialog('新增管理员（模拟）',`${field('new-name','管理员姓名','')}${field('new-account','独立账号标识','')}<div class="field"><label for="new-role">角色</label><select id="new-role"><option>运营管理员</option><option>超级管理员</option></select></div><div class="field"><label for="new-reason">开通原因 · 必填</label><textarea id="new-reason"></textarea></div><p class="muted">本页只演示独立账号与角色的开通。不会生成或发送真实凭证；凭证流程待详细需求明确。</p>`,'查看信息并确认',()=>{const name=$('#new-name').value.trim(),account=$('#new-account').value.trim(),role=$('#new-role').value,reason=$('#new-reason').value.trim();if(!name||!account||!reason){$('#dialog-error').textContent='请填写姓名、独立账号标识与原因。';return}if(admins.some(a=>a.account===account)){ $('#dialog-error').textContent='该账号标识已存在，请使用独立账号。';return}openDialog('确认新增管理员？',`<p>${esc(name)} · ${esc(account)} · ${role}</p><p>原因：${esc(reason)}</p><p>模拟账号将启用，并按所选固定角色访问后台。</p>`,'确认新增',()=>{const id='A'+(admins.length+1);admins.push({id,name,account,role,active:true});record(id,'新增管理员','成功',reason);closeDialog();msg('模拟管理员已新增。没有生成或发送真实凭证。')},{super:true,object:account,action:'新增管理员',reason})})}
document.addEventListener('click',e=>{const el=e.target.closest('button,a');if(!el)return;if(el.dataset.route){e.preventDefault();navTo(el.dataset.route);return}if(el.dataset.family){navTo('family',el.dataset.family);return}if(el.dataset.template){navTo('edit',el.dataset.template);return}if(el.dataset.admin){adminDialog(el.dataset.admin);return}if(el.dataset.range){range=el.dataset.range;render();return}const a=el.dataset.action;if(!a)return;e.preventDefault();if(modules.some(([r])=>r===a)){navTo(a);return}if(a==='clear'){query='';statusFilter=zoneFilter=cycleFilter='全部';render()}else if(a==='reload'){pageState='normal';$('#demo-page').value='normal';render()}else if(a==='family-change')familyChange();else if(['save','publish','unpublish','republish','discard','delete-draft'].includes(a))templateAction(a);else if(a==='new-template'){const id='T'+(Math.max(...templates.map(t=>Number(t.id.slice(1))))+1),kind=route;templates.push({id,kind,status:'草稿',published:null,draft:kind==='chores'?chore('','',zones[0],'每天','',20,50):perk('','',0,50)});record(id,'新建草稿');go('edit',id)}else if(a==='new-admin')newAdmin();else if(a==='reset')location.reload()});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='filter-form'){query=$('#search').value.trim();statusFilter=$('#status-filter').value;zoneFilter=$('#zone-filter')?.value||'全部';cycleFilter=$('#cycle-filter')?.value||'全部';render()}if(e.target.id==='log-filter'){query=$('#log-search').value.trim();render()}});
document.addEventListener('input',e=>{if(e.target.closest('#editor-form')){collect();dirty=true}if(e.target.id==='family-reason'){e.target.setCustomValidity('');reasonInputs[selected]=e.target.value}});
document.addEventListener('change',e=>{if(e.target.id==='edit-cycle'){edit.cycle=e.target.value;edit.params='';dirty=true;render();$('#edit-cycle').focus()}});
$('#confirm-dialog').onclick=()=>{if(modalAction)execute(modalAction,modalMeta)};
$('#cancel-dialog').onclick=closeDialog;$('#dialog').addEventListener('cancel',()=>{modalAction=modalMeta=null});
$('#demo-role').onchange=e=>{current=e.target.value;closeDialog();edit=null;dirty=false;notice='';render()};
$('#demo-page').onchange=e=>{pageState=e.target.value;clearTimeout(loadingTimer);if(pageState==='loading')loadingTimer=setTimeout(()=>{pageState='normal';$('#demo-page').value='normal';render()},1200);render()};
$('#demo-scenario').onchange=e=>{scenario=e.target.value;$('#state').textContent='下一次提交：'+e.target.selectedOptions[0].textContent};
$('#forbidden').onclick=()=>navTo('family','F1001');$('#reset').onclick=()=>location.reload();
$('#mobile-menu').onclick=()=>{$('#shell').classList.toggle('menu-open');$('#mobile-menu').setAttribute('aria-expanded',$('#shell').classList.contains('menu-open'))};
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
const parts=location.hash.slice(1).split('/');if(parts[0]){route=parts[0];selected=parts[1]||null}render();
</script>
