<!-- THESIS: 两位伴侣读懂同一个月的真实贡献。OWN-WORLD: 日常家用计量图形，紫与绿区分本人/伴侣，清楚的中文系统字和白色界面。STORY: 选月，看天平与分值，查看记录。FIRST VIEWPORT: A 中央天平、B 双方对照、C 月度记录；外部控制台切换模拟场景。FORM: 三方案粗原型；seed 06dcffc2 为探索参考；B已获本轮粗原型确认，A/C保留对照。FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance. PROTOTYPE ONLY: No production code, no real data, no storage. -->
<main class="workbench">
<aside class="controls" aria-label="原型体验控制台">
<h1>协作天平，三种看法</h1><p class="intro">切换布局与场景，看看哪一种最容易读懂彼此的付出。以下全部为模拟数据，操作只影响当前预览。</p>
<div class="variant-picks" id="variant-picks" aria-label="布局方案"></div>
<section class="control-group"><label for="scenario">体验场景</label><select id="scenario"><option value="balanced">双方贡献相近</option><option value="unequal">双方贡献差距明显</option><option value="empty">本月双方均为零</option><option value="one">已配对，只有一人有贡献</option><option value="waiting">等待伴侣加入</option><option value="archived">家庭已归档</option><option value="negative">可用积分为负，贡献正常</option></select><p class="notice">月份按北京时间自然月。页面里的邀请与积分入口也仅用于演示。</p></section>
<section class="control-group actions"><h2>核对积分与日期规则</h2><div class="action-list" id="actions"></div></section>
<details class="mobile-tools control-group"><summary>展开规则演示操作</summary><div class="action-list" id="mobile-actions"></div></details>
<p id="message" class="live-notice" role="status" aria-live="polite"></p>
<details class="state control-group"><summary>查看当前模拟状态</summary><pre id="state"></pre></details>
</aside>
<section class="phone" aria-label="手机页面预览"><div class="phone-top"><span>家务搭档</span><span class="sample">交互粗原型 · 模拟数据</span></div><div id="app"></div><div class="footer-label">当前仅展示协作天平，不代表完整小程序导航</div></section>
</main>
<nav class="switcher" aria-label="切换原型布局"><button id="previous-variant" aria-label="上一种布局"><svg class="chevron" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></svg></button><div id="variant-name" class="variant-name"></div><button id="next-variant" aria-label="下一种布局"><svg class="chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg></button></nav>
<script>
const names={A:'天平居中',B:'双方对照',C:'月度记录'};
const now=new Date();const currentMonth=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit'}).format(now);const today=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).format(now);
function previousMonth(m){const [y,n]=m.split('-').map(Number);return new Date(Date.UTC(y,n-2,1)).toISOString().slice(0,7)}
const lastMonth=previousMonth(currentMonth);let variant=new URLSearchParams(location.search).get('variant')||'B';if(!names[variant])variant='B';let scenario='balanced',selectedMonth=currentMonth,rows=[],ledger=[],wallet={},extra=null,walletOpen=false,message='';
function row(id,person,points,title,month,day=1){return{id,person,points,title,completionDate:`${month}-${String(day).padStart(2,'0')}`,submittedDate:today,active:true}}
function reset(){extra=null;walletOpen=scenario==='negative';selectedMonth=currentMonth;rows=[row('old-a','a',60,'换洗床品',lastMonth,12),row('old-b','b',50,'整理厨房',lastMonth,16)];if(scenario!=='empty'){rows.push(row('a1','a',60,'清洁厨房',currentMonth),row('a2','a',40,'整理衣物',currentMonth),row('a3','a',30,'照顾绿植',currentMonth));if(!['waiting','one'].includes(scenario)){rows.push(row('b1','b',50,'换洗床品',currentMonth),row('b2','b',40,'卫浴清洁',currentMonth),row('b3','b',30,'整理客厅',currentMonth));}if(scenario==='unequal'){rows.push(row('a4','a',100,'深度清洁厨房',currentMonth),row('a5','a',80,'全屋整理',currentMonth));}}
if(scenario==='waiting')rows=rows.filter(r=>r.person==='a');wallet={a:scenario==='negative'?-20:100,b:80};ledger=[{text:scenario==='negative'?'历史打卡撤销后的模拟余额':'其他历史收支后的模拟余额',person:'a',delta:null,balance:wallet.a},{text:'其他历史收支后的模拟余额',person:'b',delta:null,balance:wallet.b}];message='已重置模拟数据。可以切换月份、布局或演示操作。';render()}
const statDate=r=>r.completionDate||r.submittedDate;
function stats(){const selected=rows.filter(r=>r.active&&statDate(r).slice(0,7)===selectedMonth);const a=selected.filter(r=>r.person==='a'),b=selected.filter(r=>r.person==='b'),pa=a.reduce((s,r)=>s+r.points,0),pb=b.reduce((s,r)=>s+r.points,0),total=pa+pb;const shareA=total?Math.round(pa/total*100):null;return{selected,a,b,pa,pb,total,shareA,shareB:total?100-shareA:null,angle:total&&scenario!=='waiting'?(pb-pa)/total*13:0}}
function months(){return [...new Set([currentMonth,...rows.filter(r=>r.active).map(r=>statDate(r).slice(0,7))])].sort().reverse()}
const arrow=(left)=>`<svg class="chevron" viewBox="0 0 24 24"><path d="${left?'m15 5-7 7 7 7':'m9 5 7 7-7 7'}"/></svg>`;
function monthName(m){const[y,n]=m.split('-');return `${y} 年 ${Number(n)} 月`}
function scale(s){const a=s.angle*Math.PI/180,dx=Math.cos(a)*111,dy=Math.sin(a)*111;const waiting=scenario==='waiting';return `<figure class="figure" style="margin:0"><svg class="scale" viewBox="0 0 340 208" role="img" aria-label="${waiting?'等待伴侣加入，暂不比较占比':s.total?`本人贡献 ${s.shareA}%，伴侣贡献 ${s.shareB}%，贡献较多一侧较低`:'本月暂无贡献，天平居中，占比暂无'}"><path d="M170 56V186M138 186H202" stroke="#9e93ac" stroke-width="5" stroke-linecap="round"/><g class="parts" style="transform:rotate(${s.angle}deg);transform-origin:170px 63px"><path class="beam" d="M59 63H281"/></g><circle cx="170" cy="63" r="8" fill="#766885"/><g class="parts" style="transform:translate(${170-dx-59}px,${-dy}px)"><path class="string" d="M59 63 24 142H94L59 63" stroke="var(--a)"/><path d="M18 142H100Q93 166 59 166Q25 166 18 142" fill="var(--a-soft)" stroke="var(--a)" stroke-width="2"/><circle cx="59" cy="137" r="12" fill="var(--a)"/></g><g class="parts" opacity="${waiting?.35:1}" style="transform:translate(${170+dx-281}px,${dy}px)"><path class="string" d="M281 63 246 142H316L281 63" stroke="var(--b)"/><path d="M240 142H322Q315 166 281 166Q247 166 240 142" fill="var(--b-soft)" stroke="var(--b)" stroke-width="2"/>${waiting?'':`<circle cx="281" cy="137" r="12" fill="var(--b)"/>`}</g></svg><figcaption class="scale-caption">${waiting?'等另一位搭档到来':s.total?'每一份付出，都有重量':'从一点小事开始'}</figcaption></figure>`}
function people(s){return `<div class="people">${['a','b'].map((p,i)=>{let wait=p==='b'&&scenario==='waiting',pts=i?s.pb:s.pa,count=i?s.b.length:s.a.length,pct=i?s.shareB:s.shareA;return `<section class="person ${p}" aria-label="${i?'伴侣':'本人'}当月贡献"><div class="person-name"><span class="dot"></span>${wait?'等待伴侣':i?'伴侣':'我'}</div><div class="points">${wait?'—':pts}<span>${wait?'':'贡献分'}</span></div><p class="fraction">${wait?'加入后一起记录':`占比 <strong>${scenario==='waiting'||pct===null?'—':pct+'%'}</strong><br>完成 ${count} 次`}</p></section>`}).join('')}</div>`}
function warmth(s){let text=scenario==='waiting'?'你的付出，已经好好记下。':!s.total?'所选月份还没有家务记录。':'一起照顾家的这些小事，都记在这里。';return `<p class="warmth">${text}<small>${scenario==='waiting'?'邀请伴侣加入后，一起看见彼此的付出。':'分工可以不同，每一份付出都值得被看见。'}</small></p>${scenario==='waiting'?'<button class="primary" id="invite">邀请伴侣（演示）</button>':''}`}
function records(s){const visible=[...s.selected].sort((a,b)=>statDate(b).localeCompare(statDate(a))).slice(0,variant==='C'?6:3);return `<section><div class="section-head"><h3>所选月的家务记录</h3><span>${s.selected.length} 次完成</span></div>${visible.length?visible.map(r=>`<div class="record"><div class="day">${statDate(r).slice(5).replace('-','/')}</div><div class="record-title">${r.title}<small>${r.person==='a'?'我':'伴侣'}${r.id==='backfill'?' · 补记':''}${!r.completionDate?' · 未填完成日期，按记录日期统计':''}</small></div><div class="record-score">${r.points} 分</div></div>`).join(''):'<p class="empty-record">所选月份暂无有效完成记录。<br>完成记录会按贡献统计日归入相应月份。</p>'}${s.selected.length>visible.length?`<p class="notice">原型展示最近 ${visible.length} 条，共 ${s.selected.length} 条。</p>`:''}</section>`}
function walletView(){if(!walletOpen)return '';return `<section class="wallet" aria-label="积分入口演示"><h3 style="font-size:14px;margin-bottom:12px">可用积分 · 全部月份累计余额</h3><div class="wallet-row"><span>我</span><strong>${wallet.a} 分</strong></div>${scenario==='waiting'?'':`<div class="wallet-row"><span>伴侣</span><strong>${wallet.b} 分</strong></div>`}${wallet.a<0?'<p>撤销更正后余额为负，后续入账或退分会抵补。</p>':''}<small>这里展示余额，与当前选择月份的贡献分开。</small>${ledger.map(l=>`<div class="record" style="grid-template-columns:1fr auto"><div>${l.person==='a'?'我':'伴侣'} · ${l.text}<small>本次原型模拟收支</small></div><div>${l.delta===null?'':(l.delta>0?'+':'')+l.delta+' 分 · '}余额 ${l.balance}</div></div>`).join('')}</section>`}
function render(){const s=stats(),ms=months(),index=ms.indexOf(selectedMonth),archived=scenario==='archived';document.querySelector('.phone').className='phone variant-'+variant;const header=`<header class="page-header"><h2>协作天平</h2><svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M5 18 16 7 27 18M9 15V27H23V15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg></header><div class="month-nav"><button id="older" aria-label="上一个有记录的月份" ${index===ms.length-1?'disabled':''}>${arrow(true)}</button><select id="month" aria-label="选择统计月份">${ms.map(m=>`<option value="${m}" ${m===selectedMonth?'selected':''}>${monthName(m)}${m===currentMonth?' · 本月':''}</option>`).join('')}</select><button id="newer" aria-label="下一个有记录的月份" ${index===0?'disabled':''}>${arrow(false)}</button></div><p class="month-detail">北京时间自然月 · 按贡献统计日汇总</p>${archived?'<p class="status">家庭已归档 · 历史记录仅供查看</p>':''}`;
let main=variant==='A'?scale(s)+people(s)+warmth(s)+records(s):variant==='B'?people(s)+scale(s)+warmth(s)+records(s):`<div class="report-top"><p class="month-total">${scenario==='waiting'?'本人在所选月':'所选月一起'}<br>完成 <strong>${s.selected.length}</strong> 次家务<br>留下 <strong>${s.total}</strong> 贡献分</p>${scale(s)}</div>`+people(s)+records(s)+warmth(s);
document.querySelector('#app').innerHTML=`<div class="page">${header}${main}<div class="foot-link"><span>贡献与可用积分分别记录</span><button id="wallet-toggle" aria-expanded="${walletOpen}">${walletOpen?'收起积分':'查看积分'}${arrow(false)}</button></div>${walletView()}<p class="standalone-note">占比根据所选月的有效完成记录计算。兑换不改变贡献；补记、更正或撤销可能更新对应月份。</p></div>`;
document.querySelector('#variant-picks').innerHTML=Object.entries(names).map(([id,name])=>`<button data-variant="${id}" aria-pressed="${variant===id}">${id} · ${name}</button>`).join('');document.querySelectorAll('[data-variant]').forEach(b=>b.onclick=()=>setVariant(b.dataset.variant));document.querySelector('#variant-name').innerHTML=`${variant} · ${names[variant]}<small>原型布局 ${Object.keys(names).indexOf(variant)+1} / 3</small>`;
document.querySelector('#month').onchange=e=>{selectedMonth=e.target.value;render()};document.querySelector('#older').onclick=()=>{selectedMonth=ms[index+1];render()};document.querySelector('#newer').onclick=()=>{selectedMonth=ms[index-1];render()};document.querySelector('#wallet-toggle').onclick=()=>{walletOpen=!walletOpen;render()};if(document.querySelector('#invite'))document.querySelector('#invite').onclick=()=>{message='邀请入口演示：正式邀请流程沿用已确认的家庭邀请规则，本原型不会发送邀请。';render()};
const actions=[['backfill','补记上月 30 分',!!extra],['date','把补记日期改为本月',!extra||!extra.active||extra.completionDate?.startsWith(currentMonth)],['clear','清空补记完成日期',!extra||!extra.active||!extra.completionDate],['revoke','撤销这次补记',!extra||!extra.active],['spend','兑换消费 60 分',wallet.a<60||scenario==='waiting'],['refund','取消该兑换退 60 分',!ledger.some(x=>x.kind==='spend'&&!x.refunded)],['reset','重置模拟数据',false]];
for(const id of ['actions','mobile-actions']){document.getElementById(id).innerHTML=actions.map(([id,label,disabled])=>`<button data-action="${id}" ${disabled||(archived&&id!=='reset')?'disabled':''}>${label}</button>`).join('');document.getElementById(id).querySelectorAll('button').forEach(b=>b.onclick=()=>act(b.dataset.action))}
document.querySelector('#message').textContent=message;document.querySelector('#state').textContent=JSON.stringify({layout:variant,scenario,month:selectedMonth,contribution:{me:s.pa,partner:s.pb},share:{me:s.shareA,partner:s.shareB},wallet,records:rows,ledger},null,2);
window.prototypeState={variant,scenario,selectedMonth,stats:s,wallet:{...wallet},records:rows.map(r=>({...r})),ledger:ledger.map(l=>({...l}))};}
function post(delta,text,kind){wallet.a+=delta;ledger.unshift({person:'a',delta,text,balance:wallet.a,kind})}
function act(action){if(scenario==='archived'&&action!=='reset')return;if(action==='reset'){reset();return}if(action==='backfill'&&!extra){extra=row('backfill','a',30,'整理鞋柜',lastMonth,22);rows.push(extra);post(30,'补记整理鞋柜，贡献归上月','backfill');message='补记成功：可用积分现在 +30；贡献归上月。可切换上月查看。'}else if(action==='date'&&extra?.active){extra.completionDate=today;message='完成日期更正为本月：上月贡献 -30，本月 +30，可用积分不变。'}else if(action==='clear'&&extra?.active){extra.completionDate=null;message='完成日期已清空：按原补记提交日归属本月，不新增积分。'}else if(action==='revoke'&&extra?.active){extra.active=false;post(-extra.points,'撤销补记整理鞋柜','revoke');message='已撤销补记：移除该记录贡献，可用积分扣回原获 30 分。'}else if(action==='spend'&&wallet.a>=60&&scenario!=='waiting'){post(-60,'兑换消费','spend');message='可用积分 -60；双方贡献、次数和天平比例都不变。'}else if(action==='refund'){const item=ledger.find(l=>l.kind==='spend'&&!l.refunded);if(item){item.refunded=true;post(60,'取消兑换，退回原实扣','refund');message='已按原实扣退回 60 分；不增加贡献，同一笔不会重复退款。'}}render()}
function setVariant(v){variant=v;const url=new URL(location.href);url.searchParams.set('variant',v);history.replaceState({},'',url);render()}
function cycle(delta){const keys=Object.keys(names);setVariant(keys[(keys.indexOf(variant)+delta+keys.length)%keys.length])}
document.querySelector('#scenario').onchange=e=>{scenario=e.target.value;reset()};document.querySelector('#previous-variant').onclick=()=>cycle(-1);document.querySelector('#next-variant').onclick=()=>cycle(1);document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select,button,[contenteditable]'))return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();cycle(e.key==='ArrowLeft'?-1:1)}});window.addEventListener('popstate',()=>{const v=new URLSearchParams(location.search).get('variant');variant=names[v]?v:'B';render()});reset();
</script>
</body></html>
